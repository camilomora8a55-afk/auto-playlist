<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Repertorio</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --card: #FFFFFF;
      --border: #E4E4E7;
      --text: #09090B;
      --muted: #71717A;
      --radius: 16px;
      --input-radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 40px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Encabezado Principal */
    .app-header {
      text-align: center;
      margin-bottom: 8px;
    }

    .main-icon {
      width: 48px;
      height: 48px;
      background: var(--text);
      color: #FFF;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .app-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      color: var(--text);
    }

    .app-header p {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
      max-width: 420px;
      margin: 0 auto;
    }

    /* Tarjetas */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .card-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-box {
      width: 40px;
      height: 40px;
      background: var(--text);
      color: #FFF;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.95rem;
      flex-shrink: 0;
    }

    .icon-box.circle {
      border-radius: 50%;
    }

    .title-group h2, .title-group h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .title-group p {
      font-size: 0.83rem;
      color: var(--muted);
    }

    .song-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 500;
    }

    /* Formulario e Inputs */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"],
    input[type="month"],
    input[type="date"],
    textarea {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: var(--input-radius);
      background: #FFFFFF;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, textarea:focus {
      border-color: var(--text);
    }

    input::placeholder, textarea::placeholder {
      color: #A1A1AA;
    }

    textarea {
      height: 90px;
      resize: vertical;
      line-height: 1.4;
    }

    /* Botones */
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: var(--input-radius);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary {
      background: #FFFFFF;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: #F4F4F5;
    }

    .btn-primary {
      background: var(--text);
      border: 1px solid var(--text);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    /* Desplegable GitHub */
    details summary {
      list-style: none;
      cursor: pointer;
    }
    details summary::-webkit-details-marker { display: none; }

    .chevron {
      transition: transform 0.2s;
    }
    details[open] .chevron {
      transform: rotate(180deg);
    }

    .status {
      text-align: center;
      font-weight: 600;
      font-size: 0.88rem;
      padding: 12px;
      border-radius: var(--input-radius);
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Encabezado -->
    <header class="app-header">
      <div class="main-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <h1>Gestor de Repertorio</h1>
      <p>Planifica hasta 5 eventos por mes y sincroniza tus playlists de Spotify y YouTube.</p>
    </header>

    <!-- Configuración GitHub -->
    <details class="card">
      <summary class="card-header" style="margin-bottom:0;">
        <div class="card-header-left">
          <div class="icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
          </div>
          <div class="title-group">
            <h2>Conexión con GitHub</h2>
            <p>Usuario, repositorio y token de acceso</p>
          </div>
        </div>
        <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </summary>

      <div style="margin-top: 18px;">
        <div class="form-group">
          <label>USUARIO DE GITHUB</label>
          <input type="text" id="ghUser" placeholder="ej: camilomora8a55-afk">
        </div>
        <div class="form-group">
          <label>NOMBRE DEL REPOSITORIO</label>
          <input type="text" id="ghRepo" placeholder="ej: auto-playlist">
        </div>
        <div class="form-group">
          <label>PERSONAL ACCESS TOKEN (PAT)</label>
          <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
        </div>
        <button type="button" class="btn btn-secondary" style="margin-top:8px;" onclick="guardarConfig()">Guardar credenciales localmente</button>
      </div>
    </details>

    <!-- Selección de Mes -->
    <div class="card">
      <div class="card-header" style="margin-bottom:14px;">
        <div class="card-header-left">
          <div class="icon-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </div>
          <div class="title-group">
            <h2>Mes a programar</h2>
            <p>Cargamos los lunes del mes automáticamente</p>
          </div>
        </div>
      </div>
      <div class="form-group">
        <input type="month" id="mesSeleccionado">
      </div>
    </div>

    <!-- Contenedor Dinámico de Eventos -->
    <form id="repertorioForm">
      <div id="eventosContainer" style="display:flex; flex-direction:column; gap:18px;"></div>

      <!-- Acciones principales -->
      <div style="margin-top: 20px; display:flex; flex-direction:column; gap:10px;">
        <button type="button" class="btn btn-primary" onclick="guardarProgramacion()">💾 Guardar Programación en GitHub</button>
        <button type="button" class="btn btn-secondary" onclick="ejecutarSincronizacionInmediata()">🚀 Actualizar Playlists Ahora</button>
      </div>
    </form>

    <div id="status" class="status"></div>

  </div>

  <script>
    window.onload = () => {
      document.getElementById('ghUser').value = localStorage.getItem('ghUser') || '';
      document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || '';
      document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';

      const hoy = new Date();
      const mesActual = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0');
      const mesInput = document.getElementById('mesSeleccionado');
      mesInput.value = mesActual;

      // Eventos para actualizar la vista de tarjetas cuando cambia el mes
      mesInput.addEventListener('change', actualizarEventosPorMes);
      mesInput.addEventListener('input', actualizarEventosPorMes);

      actualizarEventosPorMes();
    };

    function guardarConfig() {
      localStorage.setItem('ghUser', document.getElementById('ghUser').value.trim());
      localStorage.setItem('ghRepo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('ghToken', document.getElementById('ghToken').value.trim());
      alert('Credenciales guardadas localmente.');
    }

    function formatSubDate(d) {
      const dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      return `${dias[d.getDay()]}, ${d.getDate()} De ${meses[d.getMonth()]}`;
    }

    function formatDateInput(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function calcularLunes(year, month) {
      let fechas = [];

      // 1. Último lunes del mes anterior
      let datePrev = new Date(year, month - 1, 0); // Último día del mes previo
      while (datePrev.getDay() !== 1) { // 1 = Lunes
        datePrev.setDate(datePrev.getDate() - 1);
      }
      fechas.push(new Date(datePrev));

      // 2. Lunes del mes seleccionado
      let dateCurr = new Date(year, month - 1, 1);
      while (dateCurr.getMonth() === month - 1) {
        if (dateCurr.getDay() === 1) {
          fechas.push(new Date(dateCurr));
        }
        dateCurr.setDate(dateCurr.getDate() + 1);
      }

      return fechas;
    }

    function actualizarEventosPorMes() {
      const inputVal = document.getElementById('mesSeleccionado').value;
      if (!inputVal) return;

      const [year, month] = inputVal.split('-').map(Number);
      const fechasCalculadas = calcularLunes(year, month);
      const container = document.getElementById('eventosContainer');

      // Preservar textos que el usuario ya haya escrito antes del render
      let contenidosGuardados = {};
      const inputsCanciones = container.querySelectorAll('textarea');
      inputsCanciones.forEach((ta, idx) => {
        contenidosGuardados[idx] = ta.value;
      });

      container.innerHTML = '';

      fechasCalculadas.forEach((fecha, index) => {
        const numEvento = index + 1;
        const fechaFormatted = formatDateInput(fecha);
        const subTitulo = formatSubDate(fecha);
        const textoPrevio = contenidosGuardados[index] || '';

        let tituloTarjeta = (numEvento === 1) ? "Evento 1 (Mes Anterior)" : `Evento / Semana ${numEvento - 1}`;

        container.innerHTML += `
          <div class="card" id="card-evento-${numEvento}">
            <div class="card-header">
              <div class="card-header-left">
                <div class="icon-box circle">${numEvento}</div>
                <div class="title-group">
                  <h3>${tituloTarjeta}</h3>
                  <p>${subTitulo}</p>
                </div>
              </div>
              <div class="song-counter">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
                <span id="count-${numEvento}">0</span>
              </div>
            </div>

            <div class="form-group">
              <label>FECHA DE EJECUCIÓN (LUNES)</label>
              <input type="date" id="fecha-${numEvento}" value="${fechaFormatted}">
            </div>

            <div class="form-group">
              <label>CANCIONES (NOMBRE O LINK POR LÍNEA)</label>
              <textarea id="canciones-${numEvento}" placeholder="Way Maker - Sinach&#10;https://open.spotify.com/track/..." oninput="actualizarContador(${numEvento})">${textoPrevio}</textarea>
            </div>
          </div>
        `;
      });

      fechasCalculadas.forEach((_, index) => {
        actualizarContador(index + 1);
      });
    }

    function actualizarContador(index) {
      const area = document.getElementById(`canciones-${index}`);
      if (!area) return;
      const texto = area.value.trim();
      const lineas = texto ? texto.split('\n').filter(l => l.trim().length > 0).length : 0;
      const counterSpan = document.getElementById(`count-${index}`);
      if (counterSpan) counterSpan.innerText = lineas;
    }

    async function guardarProgramacion() {
      const user = localStorage.getItem('ghUser');
      const repo = localStorage.getItem('ghRepo');
      const token = localStorage.getItem('ghToken');

      if (!user || !repo || !token) {
        mostrarStatus("⚠️ Configura Usuario, Repositorio y Token arriba.", "#FEF2F2", "#991B1B");
        return;
      }

      mostrarStatus("⏳ Guardando cambios en canciones.json...", "#FEF3C7", "#92400E");

      let programacionJSON = {};
      const tarjetas = document.querySelectorAll('#eventosContainer .card');

      tarjetas.forEach((_, idx) => {
        const i = idx + 1;
        const fechaEl = document.getElementById(`fecha-${i}`);
        const textoEl = document.getElementById(`canciones-${i}`);

        if (fechaEl && textoEl) {
          const fecha = fechaEl.value;
          const texto = textoEl.value.trim();
          if (fecha && texto) {
            const lista = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            programacionJSON[fecha] = lista;
          }
        }
      });

      try {
        const urlAPI = `https://api.github.com/repos/${user}/${repo}/contents/canciones.json`;
        let sha = "";

        const getRes = await fetch(urlAPI, { headers: { 'Authorization': `token ${token}` } });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        }

        const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(programacionJSON, null, 2))));

        const putRes = await fetch(urlAPI, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: "Actualización de canciones desde la App Web",
            content: contentEncoded,
            sha: sha ? sha : undefined
          })
        });

        if (putRes.ok) {
          mostrarStatus("✔ ¡Éxito! Canciones guardadas en GitHub.", "#ECFDF5", "#065F46");
        } else {
          throw new Error("Error en la API de GitHub.");
        }
      } catch (err) {
        mostrarStatus("❌ Error al guardar. Verifica credenciales.", "#FEF2F2", "#991B1B");
      }
    }

    async function ejecutarSincronizacionInmediata() {
      const user = localStorage.getItem('ghUser');
      const repo = localStorage.getItem('ghRepo');
      const token = localStorage.getItem('ghToken');

      if (!user || !repo || !token) {
        mostrarStatus("⚠️ Configura Usuario, Repositorio y Token arriba.", "#FEF2F2", "#991B1B");
        return;
      }

      mostrarStatus("⏳ Iniciando actualización en GitHub Actions...", "#FEF3C7", "#92400E");

      try {
        const urlAPI = `https://api.github.com/repos/${user}/${repo}/actions/workflows/sync_playlists.yml/dispatches`;

        const res = await fetch(urlAPI, {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ref: 'main' })
        });

        if (res.status === 204) {
          mostrarStatus("⚡ ¡Proceso iniciado! Playlists actualizándose.", "#ECFDF5", "#065F46");
        } else {
          throw new Error("Error al disparar la acción.");
        }
      } catch (err) {
        mostrarStatus("❌ Error al iniciar la ejecución.", "#FEF2F2", "#991B1B");
      }
    }

    function mostrarStatus(mensaje, bg, color) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.style.background = bg;
      statusDiv.style.color = color;
      statusDiv.innerText = mensaje;
    }
  </script>
</body>
</html>
