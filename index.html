<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Repertorio Mensual</title>
  <style>
    :root { --bg: #121212; --card: #1e1e1e; --accent: #1DB954; --text: #ffffff; --muted: #a0a0a0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; max-width: 650px; margin: auto; }
    h1 { color: var(--accent); text-align: center; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .card { background: var(--card); padding: 18px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #2a2a2a; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-title { font-weight: bold; color: var(--accent); font-size: 1.05rem; }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-top: 8px; margin-bottom: 4px; }
    input, textarea, select { width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #3d3d3d; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 0.9rem; }
    textarea { height: 90px; resize: vertical; font-family: monospace; }
    
    button { width: 100%; padding: 14px; border: none; color: #000; font-weight: bold; font-size: 1rem; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-save { background: var(--accent); }
    .btn-save:hover { background: #1ed760; }
    .btn-run { background: #388e3c; color: #fff; margin-top: 15px; }
    .btn-run:hover { background: #2e7d32; }

    .config-sec { border-left: 3px solid var(--accent); }
    .status { margin-top: 15px; text-align: center; font-weight: bold; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>

  <h1>🎵 Gestor de Repertorio</h1>
  <p class="subtitle">Planifica hasta 5 eventos/semanas y sincroniza las playlists.</p>

  <!-- Configuración de GitHub -->
  <details class="card config-sec">
    <summary style="cursor:pointer; font-weight:bold; color:var(--accent);">⚙️ Configuración de Conexión (GitHub)</summary>
    <label>Usuario de GitHub:</label>
    <input type="text" id="ghUser" placeholder="ej: camilomora8a55-afk">
    <label>Nombre del Repositorio:</label>
    <input type="text" id="ghRepo" placeholder="ej: auto-playlist">
    <label>Personal Access Token (PAT):</label>
    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
    <button type="button" onclick="guardarConfig()" style="background:#333; color:#fff; padding:8px; margin-top:10px;">Guardar Credenciales Localmente</button>
  </details>

  <!-- Selector de Mes -->
  <div class="card">
    <label>🗓️ Selecciona el Mes a Programar:</label>
    <input type="month" id="mesSeleccionado" onchange="autoCompletarLunes()">
  </div>

  <form id="repertorioForm">
    <!-- 5 Eventos / Semanas -->
    <div id="eventosContainer"></div>

    <button type="button" class="btn-save" onclick="guardarProgramacion()">💾 Guardar Programación en GitHub</button>
  </form>

  <!-- Botón de Ejecución Inmediata -->
  <div class="card" style="margin-top:25px; border-color:#388e3c;">
    <span class="card-title" style="color:#81c784;">⚡ Ejecución Manual Directa</span>
    <p style="font-size:0.85rem; color:var(--muted); margin-top:5px;">Sincroniza Spotify y YouTube en este instante con las canciones de la fecha actual.</p>
    <button type="button" class="btn-run" onclick="ejecutarSincronizacionInmediata()">🚀 Actualizar Playlists Ahora</button>
  </div>

  <div id="status" class="status"></div>

  <script>
    window.onload = () => {
      document.getElementById('ghUser').value = localStorage.getItem('ghUser') || '';
      document.getElementById('ghRepo').value = localStorage.getItem('ghRepo') || '';
      document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';
      
      const hoy = new Date();
      const mesActual = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0');
      document.getElementById('mesSeleccionado').value = mesActual;
      
      renderizarEventos();
      autoCompletarLunes();
    };

    function guardarConfig() {
      localStorage.setItem('ghUser', document.getElementById('ghUser').value.trim());
      localStorage.setItem('ghRepo', document.getElementById('ghRepo').value.trim());
      localStorage.setItem('ghToken', document.getElementById('ghToken').value.trim());
      alert('Credenciales guardadas en tu navegador.');
    }

    function renderizarEventos() {
      const container = document.getElementById('eventosContainer');
      container.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        container.innerHTML += `
          <div class="card" id="card-evento-${i}">
            <div class="card-header">
              <span class="card-title">Evento / Semana ${i}</span>
            </div>
            <label>Fecha de Ejecución (Lunes):</label>
            <input type="date" class="fecha-evento" id="fecha-${i}">
            <label>Canciones (Nombre o Link de Spotify/YouTube):</label>
            <textarea class="canciones-evento" id="canciones-${i}" placeholder="Way Maker - Sinach&#10;https://open.spotify.com/track/4cOdK2wG..."></textarea>
          </div>
        `;
      }
    }

    function autoCompletarLunes() {
      const [year, month] = document.getElementById('mesSeleccionado').value.split('-').map(Number);
      if (!year || !month) return;

      let date = new Date(year, month - 1, 1);
      let lunes = [];

      while (date.getMonth() === month - 1) {
        if (date.getDay() === 1) {
          const yyyy = date.getFullYear();
          const mm = String(date.getMonth() + 1).padStart(2, '0');
          const dd = String(date.getDate()).padStart(2, '0');
          lunes.push(`${yyyy}-${mm}-${dd}`);
        }
        date.setDate(date.getDate() + 1);
      }

      for (let i = 1; i <= 5; i++) {
        const inputFecha = document.getElementById(`fecha-${i}`);
        const card = document.getElementById(`card-evento-${i}`);
        if (lunes[i - 1]) {
          inputFecha.value = lunes[i - 1];
          card.style.display = 'block';
        } else {
          inputFecha.value = '';
          if (i === 5) card.style.display = 'none';
        }
      }
    }

    async function guardarProgramacion() {
      const user = localStorage.getItem('ghUser');
      const repo = localStorage.getItem('ghRepo');
      const token = localStorage.getItem('ghToken');
      const statusDiv = document.getElementById('status');

      if (!user || !repo || !token) {
        statusDiv.style.background = '#ff4d4d22';
        statusDiv.style.color = '#ff4d4d';
        statusDiv.innerText = "⚠️ Configura Usuario, Repositorio y Token en la sección superior.";
        return;
      }

      statusDiv.style.background = '#e2a03f22';
      statusDiv.style.color = '#e2a03f';
      statusDiv.innerText = "⏳ Guardando cambios en canciones.json...";

      let programacionJSON = {};

      for (let i = 1; i <= 5; i++) {
        const fecha = document.getElementById(`fecha-${i}`).value;
        const texto = document.getElementById(`canciones-${i}`).value.trim();

        if (fecha && texto) {
          const lista = texto.split('\n').map(linea => linea.trim()).filter(linea => linea.length > 0);
          programacionJSON[fecha] = lista;
        }
      }

      try {
        const urlAPI = `https://api.github.com/repos/${user}/${repo}/contents/canciones.json`;
        let sha = "";
        
        const getRes = await fetch(urlAPI, { headers: { 'Authorization': `token ${token}` } });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        }

        const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(programacionJSON, null, 2))));

        const putRes = await fetch(urlAPI, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: "Actualización de canciones desde la App Web",
            content: contentEncoded,
            sha: sha ? sha : undefined
          })
        });

        if (putRes.ok) {
          statusDiv.style.background = '#1DB95422';
          statusDiv.style.color = '#1DB954';
          statusDiv.innerText = "✔ ¡Éxito! Canciones guardadas correctamente.";
        } else {
          throw new Error("Error al guardar en GitHub.");
        }
      } catch (err) {
        statusDiv.style.background = '#ff4d4d22';
        statusDiv.style.color = '#ff4d4d';
        statusDiv.innerText = "❌ Error al guardar. Verifica el Token y los datos.";
        console.error(err);
      }
    }

    async function ejecutarSincronizacionInmediata() {
      const user = localStorage.getItem('ghUser');
      const repo = localStorage.getItem('ghRepo');
      const token = localStorage.getItem('ghToken');
      const statusDiv = document.getElementById('status');

      if (!user || !repo || !token) {
        statusDiv.style.background = '#ff4d4d22';
        statusDiv.style.color = '#ff4d4d';
        statusDiv.innerText = "⚠️ Configura Usuario, Repositorio y Token en la sección superior.";
        return;
      }

      statusDiv.style.background = '#e2a03f22';
      statusDiv.style.color = '#e2a03f';
      statusDiv.innerText = "⏳ Solicitando ejecución a GitHub Actions...";

      try {
        // Llama a la API de GitHub para disparar el workflow sync_playlists.yml
        const urlAPI = `https://api.github.com/repos/${user}/${repo}/actions/workflows/sync_playlists.yml/dispatches`;

        const res = await fetch(urlAPI, {
          method: 'POST',
          headers: {
            'Authorization': `token ${token}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            ref: 'main'
          })
        });

        if (res.status === 204) {
          statusDiv.style.background = '#1DB95422';
          statusDiv.style.color = '#1DB954';
          statusDiv.innerText = "⚡ ¡Automatización iniciada! En 1-2 minutos tus playlists de Spotify y YouTube quedarán actualizadas.";
        } else {
          throw new Error("No se pudo iniciar la acción. Revisa los permisos del token.");
        }
      } catch (err) {
        statusDiv.style.background = '#ff4d4d22';
        statusDiv.style.color = '#ff4d4d';
        statusDiv.innerText = "❌ Error al iniciar la ejecución en GitHub.";
        console.error(err);
      }
    }
  </script>
</body>
</html>
