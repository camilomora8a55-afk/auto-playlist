name: Actualizar Playlists Semanales

on:
  schedule:
    - cron: '0 12 * * 1'  # Lunes a las 12:00 UTC (7:00 AM hora Colombia)
  workflow_dispatch:

jobs:
  update-playlists:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install spotipy google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Ejecutar Script de Actualización
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_PLAYLIST_ID: ${{ secrets.SPOTIFY_PLAYLIST_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
        run: python update_playlists.py

      - name: Notificar al Celular (Éxito)
        if: success()
        run: |
          curl -H "Title: Playlists Actualizadas" \
               -H "Tags: musical_note,white_check_mark" \
               -d "🎵 Se han actualizado tus listas de Spotify y YouTube correctamente." \
               ntfy.sh/autoplaylist_camilo8a55

      - name: Notificar al Celular (Error)
        if: failure()
        run: |
          curl -H "Title: Error en Playlists" \  
               -H "Tags: x,warning" \
               -d "❌ Ocurrió un fallo durante la actualización de las listas. Revisa los logs de GitHub." \
               ntfy.sh/playlists_camilo_mora
